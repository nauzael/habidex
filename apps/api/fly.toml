# fly.toml — Hotel Platform API
# Generated: 2026-06-29
# Docs: https://fly.io/docs/reference/configuration/

app = "habidex-api"
primary_region = "mia"

[build]
  builder = "dockerfile"
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # These must be set via `flyctl secrets set` — never in this file:
  # DATABASE_URL, REDIS_URL, JWT_SECRET, RESEND_API_KEY, OPENWA_URL

[deploy]
  release_command = "node dist/migrate.js"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/static"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.concurrency]]
    type = "connections"
    hard_limit = 100
    soft_limit = 25

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

  [[services.http_checks.headers]]
    name = "Host"
    value = "habidex-api.fly.dev"
