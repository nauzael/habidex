    handoff:
      do_not_reinvestigate:
        - "Modelo de datos ya diseñado con DDL completo"
        - "Estrategia de índices y particionamiento ya definida"
      target_files:
        - "specs/001-b2b-hotel-platform/data-model.md"
      minimal_change: "Modelo de datos completo para todas las entidades del sistema"
      acceptance_checks:
        - "data-model.md existe"
        - "Contiene: Entity Definitions, ER Diagram, DDL SQL, Index Strategy, Partitioning, Migrations"
        - "DDL SQL es sintácticamente correcto para PostgreSQL 16"
