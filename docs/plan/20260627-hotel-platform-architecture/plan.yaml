      - "4 diagramas de secuencia en texto para flujos críticos con latencias target"
      - "7 bounded contexts definidos con responsabilidades claras"
      - "Estrategia multi-tenancy documentada con justificación"
      - "Estrategia de seguridad cubre: auth, authz, API keys, rate limiting, encryption"
      - "Estrategia de deployment define: HA, auto-scaling, canary, service mesh"
    success_criteria:
