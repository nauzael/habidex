  # ═══════════════════════════════════════════════════════════════════════════
  # WAVE 3: Architecture & Data Model Design (deps: Wave 2)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "HOTEL-ARCH-DESIGN"
    title: "Diseñar arquitectura de alto nivel — diagrama, componentes, flujos de datos"
    description: >
      Diseñar la arquitectura completa del sistema basada en el stack
      definido en Wave 2. Entregable: documento de arquitectura con:
      
      1. **Arquitectura de Alto Nivel**: diagrama en texto ASCII mostrando
         todos los componentes y sus relaciones:
         - API Gateway (Kong) → Backend Services
         - Core Services: Availability Service, Rate Service, Booking Service,
           Channel Sync Service, Promotion Engine, Analytics Service, Auth Service
         - Data Layer: PostgreSQL, Redis, TimescaleDB, Elasticsearch, Kafka
         - External: OTA APIs, PMS Systems, Payment Gateways
         - Infra: AWS EKS, CloudFront, Route 53, S3
      
      2. **Patrón arquitectónico**: Modular Monolith (Fase 1-2) → Microservicios
         (Fase 3+). Justificación: empezar con monolith modular bien definido
         (bounded contexts), evolucionar a microservicios cuando la escala
         lo exija. Cada módulo tiene su propio schema PostgreSQL, eventos
         vía Kafka para comunicación inter-módulo.
      
      3. **Flujos de datos críticos** (diagramas de secuencia en texto):
         a. Consulta de disponibilidad (<100ms SLA):
            CDN/Edge → API Gateway → Redis lookup (availability cache) →
            PostgreSQL (solo en cache miss) → Response
         b. Reserva (sincronización multi-canal <5s):
            OTA webhook → Booking Service → validación + lock optimista →
            PostgreSQL commit → Kafka event (reservation.confirmed) →
            Channel Sync Service consume → notificar otras OTAs vía API
         c. Sincronización de inventario pooled:
            Hotel cambia disponibilidad → Availability Service → PostgreSQL →
            Kafka event (inventory.changed) → Channel Sync Service → push
            ARI a todas las OTAs conectadas → webhook confirmación
         d. Pricing dinámico:
            Scheduled job (cada 15 min) → Rate Service → consultar occupancy
            actual + forecast + reglas de pricing → calcular nuevas tarifas →
            PostgreSQL + Kafka event (rate.updated) → notificar OTAs
      
      4. **Service Boundaries** (bounded contexts):
         - Availability Context: inventario, habitaciones, restricciones
         - Rate Context: BAR, tarifas derivadas, pricing rules
         - Booking Context: reservas, cancelaciones, modificaciones
         - Channel Context: conectores OTA/PMS, sincronización
         - Promotion Context: reglas de descuento, stacking, validación
         - Analytics Context: métricas, dashboards, forecasting
         - Tenant Context: hoteles, usuarios, roles, suscripciones
      
      5. **Estrategia de Multi-tenancy**: database-per-tenant para isolation
         máxima. Connection pooling con PgBouncer. Migrations versionadas
         por tenant. Backup individual por hotel.
      
      6. **Seguridad**: OAuth2/OIDC para autenticación, RBAC para autorización,
         API Keys para integraciones externas, rate limiting por tenant,
         WAF en CloudFront, secrets en AWS Secrets Manager, encryption
         at rest (AES-256) y en tránsito (TLS 1.3).
      
      7. **Estrategia de Deployment**: EKS multi-AZ en us-east-1, pod
         anti-affinity para alta disponibilidad, HPA (Horizontal Pod
         Autoscaler) basado en CPU + métricas custom (latencia p99),
         Karpenter para node auto-scaling, canary deployments con
         Flagger + Linkerd service mesh.
      
      Output: `specs/001-b2b-hotel-platform/architecture.md`
    wave: 3
    agent: "gem-planner"
    status: pending
    dependencies:
      - "HOTEL-STACK"
    conflicts_with: []
    context_files:
