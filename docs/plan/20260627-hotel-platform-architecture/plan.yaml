  # ═══════════════════════════════════════════════════════════════════════════
  # WAVE 2: Stack Definition (deps: Wave 1 research)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "HOTEL-STACK"
    title: "Definir stack tecnológico con justificación por capa"
    description: >
      Basado en la investigación de Wave 1, definir el stack tecnológico
      concreto con justificación detallada para cada capa. Debe cubrir:
      
      1. **Backend API**: Node.js + TypeScript + NestJS
         - Justificación: ecosistema maduro, tipado fuerte, patrones
           enterprise (modules, decorators, guards, interceptors), excelente
           soporte para OpenAPI/Swagger, librerías maduras para OAuth2,
           WebSockets, y gRPC. Gran pool de talento en LATAM.
         - Alternativas evaluadas: Go (mejor performance pero menor pool
           talento LATAM), Python/FastAPI (bueno para ML pero GIL limita
           concurrencia alta), Java/Spring (robusto pero verboso y lento
           para iterar en startup).
         - Versiones: Node.js 22 LTS, TypeScript 5.5+, NestJS 11
      
      2. **Frontend**: React 19 + Next.js 15 (App Router) + Tailwind CSS 4
         - Justificación: SSR/SSG para dashboards con buena performance,
           React Server Components para reducir JS en cliente, ecosistema
           masivo de componentes (shadcn/ui, Radix UI), mejor DX para
           aplicaciones data-heavy. Tailwind para consistencia visual.
         - Alternativas evaluadas: Vue/Nuxt (excelente pero menor ecosistema
           de componentes enterprise), Angular (demasiado pesado para
           dashboards), Svelte (ecosistema inmaduro para enterprise).
         - State management: Zustand o TanStack Query para server state.
      
      3. **Base de datos**: PostgreSQL 16 (transaccional) + TimescaleDB 2.x
         (time-series métricas) + Redis 7 (caché) + Elasticsearch 8 (búsqueda)
         - PostgreSQL: ACID para reservas, SERIALIZABLE isolation, row-level
           security para multi-tenancy, particionamiento nativo para
           inventario por hotel, extensiones: PostGIS (ubicación hoteles),
           pg_cron (jobs programados).
         - TimescaleDB: hypertables para métricas de ocupación/ADR/RevPAR,
           compresión automática, continuous aggregates para dashboards,
           retención de datos configurable.
         - Redis: caché de disponibilidad (<100ms SLA), rate limiting,
           session store, distributed locks (Redlock), pub/sub para
           invalidación de caché en tiempo real.
         - Elasticsearch: búsqueda de hoteles, autocompletado, filtros
           facetados, agregaciones para analítica.
      
      4. **Message Broker**: Apache Kafka (eventos de negocio) + RabbitMQ
         (tareas asíncronas)
         - Kafka: event backbone para sincronización de canales (inventario,
           tarifas, reservas → eventos que los channel connectors consumen),
           event sourcing para auditoría de cambios, log compacted topics
           para snapshot de estado actual.
         - RabbitMQ: tareas asíncronas con DLQ (notificaciones OTA fallidas,
           exportación de reportes, envío de emails).
      
      5. **Infraestructura**: AWS + Docker + Kubernetes (EKS) + Terraform
         - AWS: región primaria us-east-1 (mejor latencia a MX), sa-east-1
           como DR. Servicios: EKS, RDS Aurora PostgreSQL, ElastiCache,
           MSK (Kafka), OpenSearch (Elasticsearch managed), CloudFront,
           Route 53, S3, Lambda@Edge.
         - Docker: contenedores multi-stage builds optimizados.
         - Kubernetes: EKS con Karpenter para auto-scaling, Helm charts
           para deployments, ArgoCD para GitOps.
         - Terraform: IaC con módulos reutilizables, workspaces por
           ambiente (dev/staging/prod), state en S3 + DynamoDB lock.
      
      6. **CI/CD**: GitHub Actions + ArgoCD (GitOps)
         - Pipeline: lint → test → build → push image → update manifest →
           ArgoCD sync. Ambientes: dev (auto-deploy en PR merge a main),
           staging (manual approve), prod (manual approve + change ticket).
      
      7. **Monitoreo**: Grafana + Prometheus + Loki + Tempo + Sentry
         - Métricas: Prometheus con exporters para Node.js, PostgreSQL,
           Redis, Kafka. Dashboards Grafana: occupancy, ADR, RevPAR, API
           latency p50/p95/p99, error rates, channel sync health.
         - Logs: Loki con labels por tenant/hotel/service. Retención 90 días.
         - Traces: Tempo con OpenTelemetry instrumentation en todos los
           servicios. Trace ID propagation en headers HTTP.
         - Errores: Sentry con source maps para frontend, alertas en Slack.
      
      8. **API Gateway**: Kong o Traefik
         - Rate limiting por tenant y endpoint, autenticación OAuth2,
           request/response transformation, logging, circuit breaker.
      
      9. **Auth**: Keycloak (self-hosted) o Auth0
         - OAuth2 + OIDC, roles (hotel_admin, hotel_staff, agency, admin),
           MFA, SSO para clientes enterprise.
      
      Output: `specs/001-b2b-hotel-platform/stack-decision.md`
