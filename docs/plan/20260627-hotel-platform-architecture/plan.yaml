    title: "Formalizar especificación funcional (spec.md) a partir de requisitos del usuario"
    description: >
      Crear el documento de especificación funcional formal (spec.md) que
      consolida los requisitos proporcionados por el usuario, enriquecidos
      con la investigación de dominio (Wave 1). El spec.md debe seguir el
      template de Spec Kit y cubrir:
      
      1. **User Stories** para cada funcionalidad core (2.1-2.5):
         - Sistema de Disponibilidad en Tiempo Real
         - Gestión de Tarifas y Pricing Dinámico
         - Promociones y Ofertas por Temporada
         - APIs para Agencias y Terceros
         - Reportes y Analítica
         Cada user story con: As a [rol], I want [acción], So that [beneficio].
         Al menos 3-5 user stories por funcionalidad.
      
      2. **Acceptance Criteria** medibles para cada user story:
         - SLAs cuantificables (<100ms disponibilidad, <5s sync)
         - Comportamiento esperado en edge cases (sobreventa, rate disparity,
           multi-moneda, timezone conflicts)
         - Non-functional: seguridad, escalabilidad, compliance
      
      3. **Priorización**: MoSCoW para MVP (Fase 1) vs fases posteriores.
