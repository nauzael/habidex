  - id: "HOTEL-RESEARCH-ARCH-PATTERNS"
    title: "Research: Patrones arquitectónicos para channel managers y sistemas de alta concurrencia en travel tech"
    description: >
      Investigación técnica de patrones arquitectónicos específicos para
      sistemas de disponibilidad hotelera:
      1. Pooled inventory patterns: cómo otros channel managers (SiteMinder,
         Cloudbeds, D-Edge) sincronizan inventario a múltiples canales.
         Estudiar: two-way sync, ARI (Availability, Rates, Inventory) push,
         pull-based vs push-based.
      2. Concurrencia y overbooking prevention: patrón de optimistic locking
         con version numbers, transactional outbox pattern para sincronización
         OTA, distributed sagas para reservas multi-step, idempotency keys.
         Lecciones de incidentes de overbooking en la industria (ej: Airbnb,
         Booking.com outages públicos).
      3. Cache strategies para hoteles: Redis con TTL por hotel, cache
         invalidation patterns (write-through, write-behind), materialized
         views para availability queries, CDN edge caching para datos
         estáticos de hotel.
      4. Event-driven architectures en travel: evento sourcing para
         auditabilidad de cambios de disponibilidad, CQRS para separar
         reads (consultas de disponibilidad) de writes (reservas), Kafka
         como event backbone.
      5. Multi-tenancy patterns: database-per-tenant vs schema-per-tenant
         vs row-level security para 50-5000 hoteles. Isolation, backup,
         migration complexity trade-offs.
      6. Rate limiting y API throttling para APIs públicas: token bucket,
         sliding window, distributed rate limiting con Redis.
      Output: `specs/001-b2b-hotel-platform/architecture-patterns.md`
