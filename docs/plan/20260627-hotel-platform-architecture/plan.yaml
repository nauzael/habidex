# PLANNING ANALYSIS (HIGH complexity)
# ═══════════════════════════════════════════════════════════════════════════
open_questions:
  - question: "¿Cuál es el estado actual de las regulaciones de rate parity en México y Colombia?"
    context: "Algunos países han prohibido cláusulas de rate parity (Francia, Austria, Italia). Verificar si MX/CO tienen restricciones que afecten la funcionalidad de rate parity detection."
    type: decision_blocker
    affects: ["HOTEL-RESEARCH-DOMAIN", "HOTEL-SPEC"]
  - question: "¿Qué PMS locales dominan el mercado hotelero independiente en México y Colombia?"
    context: "La integración con PMS es crítica para el MVP. PMS cloud como Cloudbeds/Mews tienen APIs documentadas, pero hoteles pequeños pueden usar sistemas legacy sin API."
    type: decision_blocker
    affects: ["HOTEL-RESEARCH-DOMAIN", "HOTEL-DATA-MODEL"]
  - question: "¿AWS Local Zones o regiones edge están disponibles en las principales ciudades de México (CDMX, Cancún) y Colombia (Bogotá, Cartagena)?"
    context: "El SLA de <100ms para consultas de disponibilidad requiere latencia ultra-baja. Verificar opciones de edge computing en las zonas turísticas objetivo."
    type: decision_blocker
    affects: ["HOTEL-ARCH-DESIGN", "HOTEL-STACK"]
  - question: "¿Qué gateway de pago tiene mejor cobertura y menores comisiones para transacciones B2B transfronterizas LATAM?"
    context: "La plataforma cobrará a hoteles (B2B), no a huéspedes. Se necesita un payment gateway que soporte cobros recurrentes en MXN, COP, y USD con buenas tasas de conversión."
    type: decision_blocker
    affects: ["HOTEL-STACK", "HOTEL-SPEC"]

assumptions:
  - "Los hoteles independientes en LATAM tienen conectividad internet confiable suficiente para operar un SaaS cloud (no on-premise requerido)"
  - "Las OTAs principales (Booking.com, Expedia, Despegar, Airbnb) proveen APIs de disponibilidad/tarifas con documentación adecuada para integración"
  - "El mercado objetivo inicial (50-200 hoteles en MX/CO) no requiere multi-tenancy complejo; un modelo de database-per-tenant o schema-per-tenant es viable"
  - "La regulación de datos en LATAM (similar a LGPD de Brasil) no impone requisitos de residencia de datos más estrictos que GDPR para la fase MVP"
  - "Se puede iniciar con una arquitectura modular monolith + event bus y evolucionar a microservicios cuando la escala lo exija (Fase 3+)"
  - "Los hoteles aceptarán un modelo SaaS con suscripción mensual + comisión por reserva; el payment gateway debe soportar ambos modelos"
  - "La plataforma será web-first (React/Next.js); mobile app nativa se considera en Fase 4 si hay demanda"
  - "El equipo inicial será de 6-8 personas (2 backends, 2 frontends, 1 DevOps, 1 QA, 1 PM, 1 Designer) escalando a 15-20 en Fase 2"

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "Las integraciones OTA toman 6+ meses por certificación y colas de partner programs, bloqueando el MVP"
      likelihood: medium
      impact: critical
      mitigation: "Iniciar el proceso de partnership con Booking.com y Expedia desde el día 1 (antes de escribir código). Paralelamente, implementar un channel manager básico con actualización manual/CSV como fallback para demostrar valor temprano."
    - scenario: "La sincronización de inventario pooled tiene race conditions que causan overbooking en producción"
      likelihood: medium
      impact: critical
      mitigation: "Usar PostgreSQL con SERIALIZABLE isolation level + Redis distributed locks + idempotency keys en todas las operaciones de reserva. Implementar un reconciliation job que compare inventario real vs reservas cada 5 minutos como safety net. Testing exhaustivo con chaos engineering (particiones de red, latencia, fallos de OTA)."
    - scenario: "El pricing dinámico produce tarifas no rentables (por debajo del costo) debido a bugs en el algoritmo de stacking de promociones"
      likelihood: low
      impact: high
      mitigation: "Implementar un floor price por tipo de habitación que ninguna regla puede atravesar. Validación automática en el motor de reglas: toda tarifa final >= floor_price. Alertas automáticas si el margen cae por debajo del threshold configurado. Circuit breaker para desactivar pricing automático si se detectan anomalías."
    - scenario: "Latencia de consulta de disponibilidad >500ms en horas pico (Black Friday, puentes vacacionales) causando timeout en OTAs y pérdida de reservas"
      likelihood: medium
      impact: high
      mitigation: "Cache strategy multinivel: Redis (caché de disponibilidad con TTL 5s) + CDN para datos estáticos de hotel. Pre-warming de caché para hoteles populares. Rate limiting agresivo en API pública para proteger el sistema. Auto-scaling basado en métricas de latencia p99."
    - scenario: "Fuga de datos de pricing entre competidores (hoteles que usan la plataforma pueden inferir tarifas de otros hoteles)"
      likelihood: low
      impact: high
      mitigation: "Database-per-tenant desde el inicio. Row-level security en PostgreSQL. API Gateway con tenant isolation. Competitive benchmarking solo muestra datos agregados/anonymizados con mínimo 5 hoteles por cohorte. Auditoría de accesos cross-tenant."
    - scenario: "El equipo no logra contratar talento con experiencia en protocolos OTA (OTA XML, HTNG) en LATAM, retrasando integraciones clave"
      likelihood: medium
      impact: medium
      mitigation: "Documentar exhaustivamente los protocolos OTA internamente. Contratar 1 senior con experiencia en travel tech (remoto si es necesario). Usar librerías open-source existentes para OTA XML parsing. Plan de capacitación interna de 4-6 semanas para nuevos desarrolladores."

coordination_notes:
