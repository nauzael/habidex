      - "Bounded contexts con: responsabilidad, entidades principales, eventos que publica/consume"
      - "Estrategia de evolución: monolith → microservicios con triggers y milestones"
    handoff:
      do_not_reinvestigate:
        - "Arquitectura de alto nivel ya diseñada"
        - "Flujos de datos críticos ya documentados"
