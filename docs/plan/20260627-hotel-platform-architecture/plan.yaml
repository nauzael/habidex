  - id: "HOTEL-DATA-MODEL"
    title: "Diseñar modelo de datos inicial — entidades, relaciones, DDL PostgreSQL"
    description: >
      Diseñar el modelo de datos completo para el sistema. Entregable:
      documento con esquema de base de datos, DDL, y estrategia de
      particionamiento/índices.
      
      1. **Entidades Core** (con atributos, tipos, constraints):
         - Hotel: id, name, timezone, currency, address, star_rating, 
           checkin_time, checkout_time, active_channels[], created_at
         - RoomType: id, hotel_id, name, description, base_occupancy, 
           max_occupancy, size_sqm, bed_type, amenities[], images[]
         - Room: id, room_type_id, room_number, floor, status (AVAILABLE, 
           OCCUPIED, MAINTENANCE, OUT_OF_ORDER), last_updated
         - Inventory: hotel_id, room_type_id, date, total_rooms, 
           available_rooms, booked_rooms, oversell_limit, version 
           (optimistic lock), updated_at. UNIQUE(hotel_id, room_type_id, date)
         - Restriction: hotel_id, room_type_id, date, min_los, max_los, 
           cta (closed to arrival), ctd (closed to departure), stop_sell, 
           version. UNIQUE(hotel_id, room_type_id, date)
      
      2. **Entidades de Pricing**:
         - RatePlan: id, hotel_id, name, type (BAR, DERIVED, PROMOTIONAL, 
           CHANNEL_SPECIFIC), base_rate_plan_id (para derivadas), 
           currency, rounding_rule, is_active
         - RatePlanRule: id, rate_plan_id, rule_type (SEASONALITY, DAY_OF_WEEK, 
           ADVANCE_BOOKING, OCCUPANCY_BASED, LENGTH_OF_STAY), 
           configuration (JSONB con parámetros de la regla), priority
         - Rate: hotel_id, room_type_id, rate_plan_id, date, amount, 
           currency, version. UNIQUE(hotel_id, room_type_id, rate_plan_id, date)
         - DerivedRateRule: id, rate_plan_id, source_rate_plan_id, 
           adjustment_type (PERCENTAGE, FIXED_AMOUNT, FORMULA), 
           adjustment_value, rounding
      
      3. **Entidades de Booking**:
         - Booking: id, hotel_id, channel (DIRECT, BOOKING_COM, EXPEDIA, 
           DESPEGAR, AIRBNB), channel_booking_id, guest_name, guest_email, 
           guest_phone, checkin_date, checkout_date, total_amount, currency, 
           status (CONFIRMED, CANCELLED, MODIFIED, NO_SHOW, CHECKED_IN, 
           CHECKED_OUT), idempotency_key UNIQUE, created_at, updated_at
         - BookingRoom: id, booking_id, room_type_id, rate_plan_id, 
           date, amount, room_id (asignado al check-in)
         - Cancellation: id, booking_id, cancelled_at, reason, 
           cancellation_fee, refund_amount, refund_status
      
      4. **Entidades de Promociones**:
         - Promotion: id, hotel_id, name, description, type (DISCOUNT, 
           EARLY_BIRD, LAST_MINUTE, PACKAGE, NON_REFUNDABLE, LOYALTY), 
           discount_type (PERCENTAGE, FIXED, FREE_NIGHTS), 
           discount_value, stackable (boolean), min_margin_percent, 
           start_date, end_date, is_active
         - PromotionRule: id, promotion_id, rule_type (MIN_STAY, MAX_STAY, 
           ADVANCE_BOOKING_MIN, ADVANCE_BOOKING_MAX, SPECIFIC_DATES, 
           ROOM_TYPES, MIN_OCCUPANCY), configuration (JSONB)
         - PromotionRedemption: id, promotion_id, booking_id, 
           discount_applied, margin_before, margin_after
      
      5. **Entidades de Analytics** (TimescaleDB hypertables):
         - OccupancyMetric: hotel_id, date, room_type_id, total_rooms, 
           occupied_rooms, occupancy_pct. Hypertable particionado por date.
         - RevenueMetric: hotel_id, date, channel, total_revenue, 
           total_room_nights, adr, revpar. Hypertable por date.
         - Forecast: hotel_id, date, predicted_occupancy, confidence_low, 
           confidence_high, model_version. Hypertable por date.
      
      6. **Estrategia de Índices**:
         - Inventory: índice compuesto (hotel_id, date) para range scans,
           índice parcial para available_rooms > 0, BRIN index para
           fechas históricas.
         - Booking: índice en idempotency_key (UNIQUE), (hotel_id, 
           checkin_date), (channel_booking_id, channel).
         - Rate: índice (hotel_id, room_type_id, date), índice en version
           para optimistic locking.
         - TimescaleDB: índices automáticos en time column, continuous
           aggregates materializadas para dashboards.
      
      7. **Particionamiento**: PostgreSQL declarative partitioning por
         hotel_id (HASH) para Inventory y Rate (hot data), por date
         (RANGE) para Booking y Analytics (cold data). TimescaleDB
         hypertables con chunk interval de 1 día.
      
      8. **Migraciones**: Estrategia con Prisma o Knex.js. Migraciones
         versionadas, forward/reversible, seed data para desarrollo.
      
      Output: `specs/001-b2b-hotel-platform/data-model.md` con diagrama
      ER en texto + DDL SQL completo.
    wave: 3
    agent: "gem-planner"
    status: pending
    dependencies:
      - "HOTEL-STACK"
    conflicts_with: []
    context_files:
      - path: "specs/001-b2b-hotel-platform/stack-decision.md"
