  - id: "HOTEL-DOC-PLAN"
    title: "Generar plan técnico integral (plan.md) — roadmap, fases, equipo, presupuesto"
    description: >
      Crear el plan técnico maestro (plan.md) que integra toda la investigación
      y diseño previo en un documento ejecutivo. Debe cubrir:
      
      1. **Roadmap de Fases** con milestones medibles:
         - Fase 1 (Meses 1-6): MVP
           * M1 (Mes 2): Core data model + API interna de disponibilidad
           * M2 (Mes 3): Channel manager básico con pooled inventory + Redis cache
           * M3 (Mes 4): Integración con 2 OTAs (Booking.com, Expedia)
           * M4 (Mes 5): Dashboard básico (ocupación, ADR, RevPAR) + 2 OTAs más
           * M5 (Mes 6): Auth multi-tenant + onboarding self-service + MVP launch
         - Fase 2 (Meses 7-12): Pricing & Analytics
           * M6 (Mes 9): Dynamic pricing engine v1 + rate plans avanzados
           * M7 (Mes 11): Forecasting 30/60/90 días + rate parity detection
           * M8 (Mes 12): +3 OTAs + reporting avanzado (CSV, PDF, BI)
         - Fase 3 (Meses 13-18): Platform
           * M9 (Mes 15): APIs públicas con OAuth2 + sandbox + documentación
           * M10 (Mes 17): Revenue management AI/ML + multi-propiedad
           * M11 (Mes 18): PMS integrations (Cloudbeds, Mews, 2 locales)
         - Fase 4 (Meses 19-24): Scale
           * M12 (Mes 21): GDS (Amadeus, Sabre) + metasearch (Google, Tripadvisor)
           * M13 (Mes 23): Multi-región AWS (DR activo en sa-east-1)
           * M14 (Mes 24): White-label + partner program
      
      2. **Equipo y Presupuesto por Fase**:
         - Fase 1 (6 meses): 8 personas — $360K-480K USD
           * 2 Backend Senior ($60-80K/año c/u LATAM)
           * 2 Frontend Senior ($50-70K/año c/u)
           * 1 DevOps ($60-80K/año)
           * 1 QA Automation ($40-50K/año)
           * 1 Product Manager ($50-70K/año)
           * 1 UI/UX Designer ($40-50K/año)
           * Infraestructura: $3-5K/mes (AWS)
           * Herramientas SaaS: $1-2K/mes
         - Fase 2 (6 meses): 12-15 personas — $450K-600K USD
           * +2 Backend, +1 Data Engineer, +1 QA, +1 Support
         - Fase 3 (6 meses): 18-22 personas — $600K-800K USD
           * +2 Backend (integraciones), +1 ML Engineer, +2 Frontend, +1 Tech Writer
         - Fase 4 (6 meses): 25-30 personas — $750K-1M USD
           * +Sales Engineers, +Customer Success, +SREs
         - Total 24 meses: $2.1M-2.9M USD
      
      3. **Estrategia de Integraciones Técnicas** (detallada en sección 4):
         - OTAs: prioridad y orden (Booking.com → Expedia → Despegar → Airbnb),
           proceso de certificación, timeline estimado, protocolos
         - PMS: estrategia de conectores (adapter pattern), PMS a priorizar,
           protocolos (HTNG, REST), approach para sistemas legacy sin API
         - Payment Gateways: Stripe (internacional) + MercadoPago (LATAM),
           integración de suscripciones + cobro por reserva
         - GDS: Amadeus Web Services, Sabre APIs, requisitos de certificación
         - Metasearch: Google Hotel Center + Hotel Ads API, Tripadvisor Connect
      
      4. **Estrategia de Go-to-Market**:
         - Beta cerrada: 10-15 hoteles en Cancún/Riviera Maya (alta densidad)
         - Early adopter pricing: 50% descuento primer año
         - Adquisición: partnerships con asociaciones hoteleras MX/CO
         - Onboarding: migración de datos desde Excel/Google Sheets del hotelero
      
      Output: `specs/001-b2b-hotel-platform/plan.md`
    wave: 4
    agent: "gem-planner"
    status: pending
