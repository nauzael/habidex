  - id: "SK-INSTALL"
    title: "Instalar specify CLI con tag explícito"
    description: >
      Instalar la CLI de Spec Kit (specify) usando uv tool install.
      Estrategia revisada por riesgo:
      1. Obtener el último tag disponible del repo vía git ls-remote
      2. Instalar con --source git+https://...@<tag>
      3. Si no hay tag, instalar desde main como fallback
      4. Verificar que el binario 'specify' esté disponible en PATH
    wave: 1
    agent: "gem-devops"
    status: completed
    result: "specify v0.11.9 instalado desde tag v0.11.9. Comando real: `uv tool install 'specify-cli @ git+https://github.com/github/spec-kit.git@v0.11.9'` (--source no es flag válido; se usó sintaxis package@url). specify --version → 0.11.9, integration list → opencode disponible."
    dependencies: []
    conflicts_with: []
    details:
      steps:
        - name: "Obtener último tag"
          command: >
            git ls-remote --tags --sort=-v:refname
            https://github.com/github/spec-kit.git
            | Select-String -Pattern 'refs/tags/v?\d+\.\d+\.\d+'
            | Select-Object -First 1
            | ForEach-Object { $_ -replace '.*refs/tags/', '' }
          fallback: "main"
        - name: "Instalar specify CLI"
          command: >
            $tag = (git ls-remote --tags --sort=-v:refname
            https://github.com/github/spec-kit.git
            | Select-String -Pattern 'refs/tags/v?\d+\.\d+\.\d+'
            | Select-Object -First 1
            | ForEach-Object { $_ -replace '.*refs/tags/', '' });
            if (-not $tag) { $tag = 'main' };
            Write-Host "Instalando specify-cli desde tag: $tag";
            uv tool install specify-cli
            --source "git+https://github.com/github/spec-kit.git@$tag"
        - name: "Verificar instalación"
          command: "specify --help"
    verification: >
      specify --version ;
      if ($LASTEXITCODE -eq 0) { "specify CLI instalado correctamente" }
      else { throw "specify CLI no disponible en PATH" }
    acceptance_criteria:
      - "exit code 0 en specify --version"
      - "specify --help muestra output de ayuda sin errores"
      - "specify integration list muestra 'opencode' como integración disponible"
      - "specify CLI disponible en PATH global"
    tech_stack: ["Python 3.12", "uv 0.11.7", "Git"]
    handoff:
