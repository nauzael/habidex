  - id: "CORR-02"
    title: "Row-Level Security (RLS) reemplaza database-per-tenant"
    description: >
      ELIMINAR database-per-tenant para MVP. Implementar multi-tenancy con
      RLS en PostgreSQL. Un solo schema con tenant_id column en todas las tablas.
      Documentar y preparar:
      1. Estrategia: tenant_id UUID NOT NULL en toda tabla multi-tenant (hotel_id).
         Usar PostgreSQL Row-Level Security con policy por tenant_id.
      2. Función set_tenant_context(): set_config('app.tenant_id', id, true) llamada
         al inicio de cada request después de autenticar al usuario.
      3. Políticas RLS: CREATE POLICY tenant_isolation ON inventory
         USING (hotel_id = current_setting('app.tenant_id')::UUID).
      4. Connection pooling: PgBouncer o Neon built-in pooler.
      5. Migración futura: script para extraer tenant a DB separada cuando
         >500 hoteles o cliente Enterprise lo exija.
      6. Índices: índice compuesto (hotel_id, date) en todas tablas multi-tenant.
      Output: `docs/plan/20260629-hotel-platform-dev/decisions/rls-multitenancy.md`
    wave: 0
    agent: "gem-planner"
    status: pending
    dependencies: []
    conflicts_with: []
