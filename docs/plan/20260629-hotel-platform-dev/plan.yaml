  - id: "CORE-04"
    title: "Redis caching layer avanzado: rate limiting, sesiones, locks"
    description: >
      Implementar capa de Redis para rendimiento y control:
      1. Rate limiting: @nestjs/throttler con Redis store (ioredis).
         Config: free=100req/min, micro=300, starter=500, growth=1000,
         pro=2000, founders=2000. Endpoints públicos más restrictivos.
      2. Session store: Redis para refresh tokens. TTL = 7 días.
         Blacklist de JWT invalidados (logout, password change).
      3. Distributed locks: Redlock pattern para operaciones críticas
         (reserva, actualización de inventario). Lock TTL = 2s, retry
         3 veces con 100ms delay. Usar ioredis + redlock package.
      4. Cache warming: al iniciar app, cargar inventario de los próximos
         7 días de hoteles activos a Redis. Job BullMQ schedule cada 5 min.
      5. Health check: Redis ping cada 30s. Circuit breaker: si Redis caído,
         servir desde PostgreSQL directamente (más lento pero funcional).
      Output: RedisModule con rate limiting, session, locks, cache warming.
