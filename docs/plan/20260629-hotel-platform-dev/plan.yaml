      2. CD: deploy a Fly.io en push a main. Usar flyctl deploy con
         --build-only en CI y --ha=false para MVP (una instancia).
      3. Ambientes: dev (auto-deploy main -> fly.io), staging (manual approve
         desde branch), prod (fly.io production, manual approve después de
         staging). Para MVP usar solo dev + prod.
      4. Quality gates: lint+typecheck+tests pasan antes de deploy.
