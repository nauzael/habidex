  - id: "OTA-06"
    title: "Edge cases de booking: cancelaciones, modificaciones, no-shows, overbooking recovery"
    description: >
      Implementar manejo de edge cases en el ciclo de vida de reservas:
      1. Cancelaciones: Booking status -> CANCELLED. Devolver inventario
         (incrementar available_rooms). Calcular cancellation fee según
         política del hotel (free cancellation hasta X días antes,
         50% después, 100% no-show). Refund amount -> PENDING/COMPLETED/FAILED.
         Notificar a canales OTA.
      2. Modificaciones: cambiar fechas, room type, número de huéspedes.
         Como cancelación + nueva reserva (para mantener audit trail).
         Preservar idempotency_key original. Ajustar tarifa.
      3. No-shows: job BullMQ cada hora checkea bookings con status CONFIRMED
         y checkout_date < now(). Marcar NO_SHOW. NO devolver inventario
         (huésped no llegó pero habitación no se puede revender ese día).
      4. Partial bookings: reserva de múltiples room types donde algunos
         están disponibles y otros no. Transacción: reservar todos o
         ninguno (SERIALIZABLE). Si no todos disponibles -> rechazar
         completa (no reserva parcial).
      5. Overbooking recovery flow:
         a. Detectar overbooking: reconciliation job encuentra
            available_rooms < 0.
         b. Alertar inmediatamente: WhatsApp admin hotel + dashboard alerta.
         c. Opciones: upgrade a room superior, relocalizar a hotel aliado,
            compensación al huésped.
         d. Tracking: incident report con causa raíz, resolución, tiempo.
         e. SLA: detectar en <1min, alertar en <2min.
      Output: Edge case handlers + recovery flow + tests.
    wave: 3
    agent: "gem-implementer"
    status: pending
    dependencies: ["CORE-01", "OTA-03"]
    conflicts_with: []
    flags:
      requires_design_validation: false
    tech_stack: ["NestJS 11", "BullMQ"]
    acceptance_criteria:
      - "Cancelación: devuelve inventario, calcula fee, notifica canales"
      - "Modificación: cancel + new booking con mismo idempotency_key"
      - "No-show: job automático, no devuelve inventario"
      - "Partial booking: rechazar si no todos disponibles"
      - "Overbooking: detectar <1min, alertar WhatsApp <2min"
    handoff:
      do_not_reinvestigate:
        - "Edge cases implementados en booking.service.ts"
        - "Overbooking recovery flow documentado"
      target_files:
        - "apps/api/src/booking/"
        - "apps/api/src/booking/booking.service.ts"
      acceptance_checks:
        - "Test: cancelar booking -> inventario restaurado"
        - "Test: no-show job -> booking.status = NO_SHOW"
        - "Test: overbooking detection -> alerta WhatsApp"

