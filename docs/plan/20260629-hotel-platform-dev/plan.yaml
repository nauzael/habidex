         Tiempo: <30 min manual.
      2. Si Neon falla: pg_dump diario listo. Restore en Render PostgreSQL
         ($7/mes). DATABASE_URL swap en variables de entorno.
         Tiempo: <30 min restore + redeploy.
      3. Si Upstash falla: Redis local en Fly.io (pequeño volumen).
         Configuración: REDIS_URL apunta a localhost si Upstash caído.
         Degradado: sin rate limiting, sin caché (PostgreSQL directo).
      4. Si WhatsApp API falla: fallback a email. Template de email
         con mismo contenido que WhatsApp.
      5. Data loss scenario: restore desde último pg_dump + replay de
         eventos BullMQ (logs de acciones desde último backup).
