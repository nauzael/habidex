  - id: "FND-03"
    title: "Secrets Management + Logging + Backup strategy"
    description: >
      Configurar gestión de secretos, logging estructurado y backup:
      1. Secrets Management: API keys de OTAs, WhatsApp, email service en
         Fly.io secrets (fly secrets set). Para desarrollo local: .env.local
         cifrado con git-crypt o sops. Rotación manual cada 90 días.
         NO almacenar secrets en GitHub.
      2. Logging estructurado: NestJS Logger con format JSON (usando
         pino-logger o nestjs-pino). Correlation ID en cada request
         (generado en middleware, propagado a colas BullMQ). Log levels:
         error, warn, info, debug. Estructura: {correlationId, timestamp,
         service, level, message, tenantId, requestId, ...metadata}.
         Logs en stdout (Fly.io los captura). Retención: 30 días gratis,
         90 días cuando pagado.
      3. Backup: pg_dump diario a volumen Fly.io (5GB). Script en
         BullMQ job schedule (every 24h). Archivo: backup_YYYYMMDD.sql.gz.
         WAL archiving si disponible en Neon. Restore script: pg_restore
         con validación de integridad. RPO: <24h (diario). RTO: <30 min
         (restore desde último backup). Probar restore semanalmente.
      4. Monitoring: health endpoint (/health) con checks: DB, Redis, colas.
         Uptime monitoring con Fly.io dashboard + ping (healthchecks.io
         gratis para MVP).
