# ═══════════════════════════════════════════════════════════════════════════
# PLAN: Desarrollo Definitivo — Plataforma B2B Hotelera
# ═══════════════════════════════════════════════════════════════════════════
plan_id: "20260629-hotel-platform-dev"
objective: >
  Plan de desarrollo completo para plataforma B2B SaaS de gestión de disponibilidad hotelera
  (Channel Manager + Revenue Management) para hoteles independientes en Colombia.
  Stack: Node.js/NestJS/TypeScript + React/Next.js/Tailwind + PostgreSQL/Redis.
  MVP en Fly.io + Neon + Upstash ($0-2/mes). Incluye todas las correcciones arquitectónicas,
  testing continuo, seguridad, operaciones y onboarding beta.
created_at: "2026-06-29T10:55:00Z"
created_by: "gem-planner"
status: pending
  tldr: >
  Plan de 8 waves (0-7) con 41 tareas para construir la plataforma completa. Wave 0 corrige
  overengineering (BullMQ reemplaza Kafka, RLS reemplaza database-per-tenant, NestJS middleware
  reemplaza Kong). Waves 1-5 construyen fundación, core MVP, OTAs, experiencia hotelero y
  plataforma. Wave 6 es testing continuo (Jest, Supertest, k6, mock OTA). Wave 7 es beta
  presencial en Tolú/Coveñas. WhatsApp vía OpenWA (self-hosted, $0) con adapter pattern para
  migrar a API oficial cuando haya flujo de caja. Backlog post-MVP para Fase 2-3.

