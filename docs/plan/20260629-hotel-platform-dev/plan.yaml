open_questions:
  - question: "¿Qué proveedor de facturación electrónica (Xubio, Siigo, Alegra) tiene mejor API para integración B2B SaaS?"
    context: "La DIAN exige facturación electrónica en Colombia. Integrar con proveedor de API. Evaluar: documentación, sandbox, costos, soporte para suscripciones recurrentes."
    type: decision_blocker
    affects: ["PLAT-03", "PLAT-04"]
  - question: "¿Se necesita registro INVIMA o alguna certificación adicional para operar como plataforma hotelera en Colombia?"
    context: "Verificar requisitos regulatorios específicos para plataformas de intermediación hotelera en Colombia, más allá de facturación electrónica."
    type: decision_blocker
    affects: ["PLAT-04"]
  - question: "¿Cuál es el tiempo real de aprobación de WhatsApp Business API para una startup colombiana sin historial?"
    context: "Meta tiene procesos de revisión. Si toma >2 semanas, ajustar timeline de WhatsApp en Wave 4."
    type: research
    affects: ["EXP-06"]

assumptions:
  - "Fly.io, Neon y Upstash mantendrán sus tier free durante los primeros 12 meses del proyecto"
  - "Booking.com Connectivity Program aceptará a una startup colombiana sin hoteles conectados (probar con plan piloto de 10 hoteles)"
  - "Los hoteleros beta aceptarán usar PWA en sus celulares Android sin necesidad de instalar app nativa"
  - "La conectividad 4G en Tolú y Coveñas es suficiente para sincronización offline-online <30s"
  - "Los hoteles beta tienen al menos un smartphone Android en recepción para operar la plataforma"
  - "La transición de Founders (6 meses full → plan pago) tendrá 30 días de gracia con notificación a los 5 meses"

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "Certificación Booking.com toma >6 meses, bloqueando integración OTA principal"
      likelihood: medium
      impact: critical
      mitigation: "Flujo puente (WhatsApp + Demand API + CSV) funciona desde MVP sin certificación. El hotelero no nota la diferencia. Push automático reemplaza flujo manual cuando llegue certificación."
    - scenario: "BullMQ con Redis en Upstash 10MB free es insuficiente para colas de sincronización OTA"
      likelihood: medium
      impact: high
      mitigation: "Mantener colas pequeñas (TTL corto, máx 100 mensajes en cola). Si escala, migrar a Upstash Pro ($5/mes) o Redis propia en Fly.io."
    - scenario: "Hoteleros beta no adoptan la plataforma por complejidad tecnológica"
      likelihood: medium
      impact: critical
      mitigation: "Onboarding presencial obligatorio. UI ultra-simple (3 botones principales). WhatsApp como interfaz primaria. Don José no toca el celular del recepcionista."
    - scenario: "Neon free tier (0.5GB) se queda sin storage con datos de 10 hoteles en 3 meses"
      likelihood: medium
      impact: high
      mitigation: "Monitorear crecimiento. Migrar a Neon Scale ($19/mes) o Render PostgreSQL ($7/mes) cuando supere 300MB. Script de migración preparado desde Día 1."
    - scenario: "Fly.io no permite NestJS + BullMQ worker en una sola VM 256MB (OOM)"
      likelihood: high
      impact: high
      mitigation: "Separar API y worker en dos procesos Fly.io (2x256MB). Usar solo 1 VM si crédito es limitado, con worker como child process limitado a 128MB."
    - scenario: "Rate limiting de WhatsApp Business API (1000 mensajes/día en tier free) insuficiente para notificaciones"
      likelihood: medium
      impact: medium
      mitigation: "Priorizar solo notificaciones críticas (reservas, alertas overbooking). Diferir campañas marketing a Fase 2 cuando se pueda pagar tier superior."
    - scenario: "Pérdida de datos de inventario por falta de WAL archiving en Neon free tier"
      likelihood: low
      impact: critical
      mitigation: "pg_dump diario a Fly.io storage (5GB gratis). WAL archiving si Neon lo permite en free. RTO >30min pero RPO <24h. Aceptable para MVP."

coordination_notes:
  - "Wave 0 debe completarse ANTES de cualquier desarrollo. Las correcciones arquitectónicas afectan todas las decisiones de implementación."
  - "Wave 3 (OTAs) corre paralela a Wave 2 (Core MVP). La certificación OTA es proceso administrativo externo que comienza Día 1."
  - "Wave 6 (Testing) corre en paralelo a Waves 1-5. Cada tarea de implementación produce tests en la misma wave."
  - "Wave 7 (Beta) requiere que Waves 2-5 estén completas. Founders deben tener todo operativo 2 semanas antes del inicio beta."
  - "WhatsApp Business API registration debe iniciarse en Wave 1 (proceso Meta de 1-14 días) para tener API key disponible en Wave 4."
  - "Booking.com y Despegar partnerships deben iniciarse en Wave 3 Día 1, sin esperar código. Son procesos administrativos externos."

