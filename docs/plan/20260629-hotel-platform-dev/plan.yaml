  - id: "CORE-02"
    title: "Pooled inventory con optimistic locking + Redis cache"
    description: >
      Implementar servicio de inventario pooled con concurrencia segura:
      1. AvailabilityService: consulta de disponibilidad por hotel + fechas.
         GET /api/v1/availability?hotelId=X&checkin=Y&checkout=Z&roomTypeId=W
         Retorna: { dates: [{ date, available, total, rate }] }.
      2. Redis cache: key = avail:{hotelId}:{roomTypeId}:{date}. TTL = 5s.
         Cache-aside pattern: leer de Redis, si miss -> PostgreSQL -> set cache.
         Invalidación en write: eliminar key de Redis al actualizar inventario.
      3. Optimistic locking: UPDATE inventory SET available_rooms = available_rooms - 1,
         version = version + 1 WHERE hotel_id = $1 AND room_type_id = $2 AND
         date = $3 AND version = $4. Si rows_affected = 0, retry.
      4. SERIALIZABLE isolation: en transacciones de reserva que modifican
         inventario, usar SET TRANSACTION ISOLATION LEVEL SERIALIZABLE.
         Retry en serialization failure (40001).
      5. Bulk availability: GET /api/v1/availability/bulk?hotelId=X&
         from=Y&to=Z. Retorna matriz 2D: roomType x date con disponibilidad y
         tarifa mínima. Cacheado en Redis con TTL 10s.
      6. Endpoints:
         - GET /api/v1/availability/:roomTypeId/:date
         - PATCH /api/v1/inventory/:roomTypeId/:date (update manual hotelero)
         - POST /api/v1/inventory/bulk (batch update desde CSV o calendario)
         WebSocket (Socket.io) para actualizaciones en tiempo real del dashboard.
      Output: AvailabilityModule completo con API, cache, locks, tests.
