      - "Redis cache se invalida al actualizar inventario"
      - "SERIALIZABLE isolation + retry en serialization failure"
      - "Bulk availability: matriz roomType x date en <200ms"
      - "WebSocket notifica cambios de disponibilidad a dashboard"
    handoff:
