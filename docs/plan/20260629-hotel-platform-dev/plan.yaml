  - id: "CORR-01"
    title: "BullMQ reemplaza Kafka + RabbitMQ + Debezium"
    description: >
      ELIMINAR Kafka, RabbitMQ y Debezium del stack MVP. Reemplazar con BullMQ
      (colas basadas en Redis) para tareas asíncronas. Documentar:
      1. Arquitectura de colas: cola por tipo de tarea (ota-sync, notifications,
         reconciliation, webhooks, reports). Cada cola con su worker dedicado.
      2. BullMQ configuración: conexión Upstash Redis, default job options
         (attempts=3, backoff=exponential, removeOnComplete=100),
         rate limiting por cola (ota-sync: 10 jobs/min por OTA).
      3. Patrón de reintentos: retry con backoff exponencial (1min, 5min, 15min),
         DLQ después de 3 intentos fallidos, alerta en DLQ > 5 mensajes.
      4. Diferir Kafka a Fase 3 (>200 hoteles). Documentar trigger de migración.
      5. Jobs programados: usar @nestjs/schedule + BullMQ repeatable jobs
         (reconciliation cada 5 min, backup diario, reportes semanales).
      Output: `docs/plan/20260629-hotel-platform-dev/decisions/bullmq-architecture.md`
    wave: 0
    agent: "gem-planner"
    status: pending
    dependencies: []
    conflicts_with: []
    flags:
      requires_design_validation: false
    acceptance_criteria:
      - "Kafka + RabbitMQ + Debezium eliminados del stack MVP documentado"
      - "BullMQ configurado con: colas definidas, job options, rate limiting, DLQ"
      - "Migración planificada a Kafka en Fase 3 con trigger numérico (>200 hoteles)"
      - "Jobs programados identificados: reconciliation (5min), backup (24h), reportes (7d)"
    success_criteria:
