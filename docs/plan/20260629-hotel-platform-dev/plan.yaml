  - id: "CORR-03"
    title: "NestJS middleware reemplaza Kong API Gateway"
    description: >
      ELIMINAR Kong del stack MVP. Usar middleware nativo de NestJS:
      1. Rate limiting: @nestjs/throttler + express-rate-limit configurado por
         endpoint y por tenant (usa Redis store con Upstash).
         Free tier: 100 req/min por tenant. Paid: 1000 req/min.
      2. Guards de auth: NestJS @UseGuards(JwtAuthGuard, RolesGuard) con
         roles por plan (free, micro, starter, growth, pro, founders).
      3. Request validation: class-validator + class-transformer con
         ValidationPipe global.
      4. Logging: interceptors para request/response logging con correlation ID.
      5. Compresión: compression middleware para respuestas JSON grandes.
      Output: `docs/plan/20260629-hotel-platform-dev/decisions/nestjs-middleware.md`
