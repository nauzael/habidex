  - id: "FND-02"
    title: "CI/CD: GitHub Actions + Deploy automático a Fly.io"
    description: >
      Configurar pipelines de CI/CD:
      1. CI: lint (ESLint + Prettier), type-check (tsc --noEmit), test (jest),
