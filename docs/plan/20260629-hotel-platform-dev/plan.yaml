  - id: "FND-04"
    title: "Auth básico: login, registro, JWT, roles por plan"
    description: >
      Implementar sistema de autenticación completo:
      1. Registro: POST /auth/register con email, password, nombre hotel,
         nombre usuario. Validación con class-validator. Hash de password
         con bcrypt (cost=12).
      2. Login: POST /auth/login con email+password -> JWT access token
         (15 min) + refresh token (7 días, httpOnly cookie o body).
      3. JWT: payload {sub: userId, email, hotelId, role, plan}.
         Firma con RS256 (par de llaves generado).
      4. Roles: admin (dueño hotel), staff (empleado), super_admin (sistema).
         Por plan: free, micro, starter, growth, pro, founders.
      5. Guards: JwtAuthGuard (valida token), RolesGuard (valida rol),
         PlanGuard (valida plan tiene feature). Ej: @UseGuards(PlanGuard)
         @Plan('whatsapp') para endpoints de WhatsApp.
      6. Password reset: POST /auth/forgot-password (envía email con link
         + token 1h), POST /auth/reset-password (cambia password).
      7. Rate limiting en login: 5 intentos/min por IP. Account lockout
         después de 10 intentos fallidos (30 min).
      8. Middleware set_tenant_context: extraer hotelId del JWT, llamar
         set_config('app.tenant_id', hotelId) para RLS.
      Output: Módulo Auth completo con guards, DTOs, tests.
