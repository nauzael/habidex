  - id: "CORR-04"
    title: "Redefinir arquitectura como Modular Monolith"
    description: >
      Mover diagrama de arquitectura de microservicios a Modular Monolith real.
      NestJS modules con bounded contexts claros pero en el mismo proceso:
      1. Módulos NestJS: AvailabilityModule, RateModule, BookingModule,
         ChannelSyncModule, PromotionModule, AnalyticsModule, AuthModule,
         NotificationModule, AdminModule.
      2. Cada módulo con: controlador (si expone API), servicio, DTOs,
         entidades (TypeORM o Prisma), repositorio, eventos que publica/consume.
      3. Comunicación inter-módulo: directa vía servicios (no HTTP ni mensajería).
         Solo sincronización OTA externa usa BullMQ.
      4. Límites: cada módulo tiene su propio schema PostgreSQL (mismo DB,
         schemas separados: availability, rates, bookings, channels, etc.).
      5. Migración a microservicios: extraer módulo completo (controlador +
         servicio + schema DB) a servicio independiente. Trigger: cuando
         el equipo tenga 3+ desarrolladores por módulo o cuando métricas
         de acoplamiento justifiquen separación.
      Output: `docs/plan/20260629-hotel-platform-dev/decisions/modular-monolith.md`
